name: Qodana

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qodana:
    name: Qodana - ${{ matrix.project-dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project-dir: backend
            linter: jetbrains/qodana-jvm-community:2026.2
          - project-dir: frontend
            linter: jetbrains/qodana-js:2026.2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          args: >-
            --linter ${{ matrix.linter }}
            --project-dir ${{ matrix.project-dir }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
